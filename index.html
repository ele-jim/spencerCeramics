<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- The viewport meta tag makes the site responsive on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spencer Ceramics</title>
  <meta name="description" content="Spencer Ceramics | Professional tilting services in Northamptonshire and around | Kitchens, Bathrooms, Floors, Swimming Pools, etc | EST 2018.">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph Tags for SEO -->
  <meta property="og:title" content="Full Page Scrolling Website">
  <meta property="og:description" content="Spencer Ceramics | Professional tilting services in Northamptonshire and around | Kitchens, Bathrooms, Floors, Swimming Pools, etc | EST 2018.">
  <meta property="og:type" content="website">
  
  <!-- Mobile Web App meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="images/icons/logo.webp">
  
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <!-- Persistent Title (always visible at top left) -->
  <div id="persistentTitle" class="persistent-title" data-current-title="Home">Home</div>
  
  <!-- Navigation Menu (hidden by default, appears in place of the persistent title) -->
  <nav id="pageMenu" class="page-menu">
    <ul>
      <li data-target="page1">Home</li>
      <li data-target="page2">Endorsements</li>
      <li data-target="page3">Our Work</li>
      <li data-target="page4">About Us</li>
    </ul>
  </nav>
  
  <main class="container">
    <!-- Each section has a data-title attribute for its title -->
    <!-- Home Page -->
    <section class="page" id="page1" data-title="Home">
      <img class="tile" src="/images/icons/logo_with_txt.webp" alt="Logo with Text">
    </section>
    <!-- Endorsements Page -->
    <section class="page" id="page2" data-title="Endorsements">
      <div class="page-content">
        <p>Welcome to Page 2. Enjoy our content as you scroll.</p>
      </div>
    </section>
    <!-- Images Page -->
    <section class="page" id="page3" data-title="Our Work">
      <div class="page-content">
        <p>Welcome to Page 3. The journey continues here.</p>
      </div>
    </section>
    <!-- About/Contact Page -->
    <section class="page" id="page4" data-title="About Us">
      <div class="page-content">
        <p>Welcome to Page 4. Thank you for visiting our site!</p>
      </div>
    </section>
  </main>
  
  <script src="assets/js/page.js"></script>
</body>
</html>
