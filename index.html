<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Responsive viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spencer Ceramics</title>

  <meta name="robots" content="index, follow">

<body>
  <main class="container">
    <!-- Page 1: Wallpaper Background & Logo with White Box -->
    <section class="page" id="page1">

      <div class="wallpaper-container">
        <img src="images/wallpaper/layerZero.png" alt="Wallpaper Layer 0">
        <img src="images/wallpaper/layerOne.png" alt="Wallpaper Layer 1">
        <img src="images/wallpaper/layerTwo.png" alt="Wallpaper Layer 2">
        <img src="images/wallpaper/layerThree.png" alt="Wallpaper Layer 3">
        <img src="images/wallpaper/layerFour.png" alt="Wallpaper Layer 4">
        <img src="images/wallpaper/layerFive.png" alt="Wallpaper Layer 5">
      </div>
      <!-- White Box Behind the Logo -->
      <div class="logo-container">
        <img class="tile" src="images/icons/logo_with_txt.webp" alt="Logo with Text">
      </div>
    </section>
    
    <!-- Page 2: (No styling needed, will use defaults) -->
    <section class="page" id="page2">
      <!-- Content for page 2 can be added here later -->

    <!-- Page 3 -->
    <section class="page" id="page3">
      <!-- Content for page 3 can be added here later -->
